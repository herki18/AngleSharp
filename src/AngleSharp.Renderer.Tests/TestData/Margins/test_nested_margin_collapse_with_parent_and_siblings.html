<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body id="test4-body" style="margin:8px; background-color: lightgray;">
<!-- Outer container with its own margin and padding -->
<div id="test4-outer-container" style="display:block; margin:12px; padding:5px; background-color: orange;">
    <!-- Nested sibling divs -->
    <div id="test4-nested1" style="display:block; height:30px; margin:10px; background-color: cyan;">Nested Div 1</div>
    <div id="test4-nested2" style="display:block; height:30px; margin:10px; background-color: magenta;">Nested Div 2</div>
    <div id="test4-nested3" style="display:block; height:30px; margin:10px; background-color: yellow;">Nested Div 3</div>
</div>
<!-- Additional sibling divs at the same level as the outer container -->
<div id="test4-sibling1" style="display:block; height:50px; margin:8px; background-color: pink;">Sibling Div 1</div>
<div id="test4-sibling2" style="display:block; height:50px; margin:8px; background-color: purple;">Sibling Div 2</div>
</body>

</html>
