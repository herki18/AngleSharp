<div id="d1" class="box" style="margin-top: 20px;">
    <!-- D2 -->
    <div id="d2" class="box" style="margin-top: -10px;">
        <!-- D3 -->
        <div id="d3" class="box" style="margin-top: 15px;">
            <div id="d4" class="box" style="margin-top: 10px">Hello</div>
        </div>
    </div>
</div>


<script>
    // Build a model of various position metrics for an element.
    function getElementModel(el) {
        const rect = el.getBoundingClientRect();
        const clientRects = Array.from(el.getClientRects()).map(r => ({
            top: r.top,
            left: r.left,
            width: r.width,
            height: r.height,
            bottom: r.bottom,
            right: r.right
        }));

        let boxQuads = [];
        if (typeof el.getBoxQuads === 'function') {
            // getBoxQuads() returns an array of DOMQuad objects.
            // Some browsers support a toJSON() method on these objects.
            boxQuads = Array.from(el.getBoxQuads()).map(q =>
                typeof q.toJSON === 'function' ? q.toJSON() : {
                    p1: q.p1, p2: q.p2, p3: q.p3, p4: q.p4
                }
            );
        }

        return {
            tagName: el.tagName,
            id: el.id,
            boundingRect: {
                top: rect.top,
                left: rect.left,
                width: rect.width,
                height: rect.height,
                bottom: rect.bottom,
                right: rect.right
            },
            offsetTop: el.offsetTop,
            offsetLeft: el.offsetLeft,
            clientRects: clientRects,
            boxQuads: boxQuads
        };
    }

    // Recursively build and print a model for an element and its children.
    function logElementModels(el, indent = "") {
        const model = getElementModel(el);
        // Print the model as a JSON string with indentation.
        console.log(indent + JSON.stringify(model, null, 2));
        for (const child of el.children) {
            logElementModels(child, indent + "  ");
        }
    }

    window.addEventListener("load", function() {
        console.log("=== Element Position Model ===");
        logElementModels(document.body);
    });
</script>
</body>
</html>
